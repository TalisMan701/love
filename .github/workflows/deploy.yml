name: Deploy to Aeza

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: love-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript
        run: npm --prefix letter-for-you run check

      - name: Run existing tests
        run: node --test letter-for-you/tests/preload.test.mjs

      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          bash deploy/test-activate.sh

      - name: Upload and activate release
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/upload-release.sh

      - name: Verify public HTTPS
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          actual=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 https://artkompaneets.ru/release.txt)
          test "$actual" = "$RELEASE_ID"
          curl --fail --silent --show-error --max-time 20 https://artkompaneets.ru/ -o /dev/null
