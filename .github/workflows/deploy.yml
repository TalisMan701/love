name: Deploy to Aeza

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: love-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript
        run: npm --prefix letter-for-you run check

      - name: Run automated tests
        run: node --test letter-for-you/tests/preload.test.mjs deploy/build-site.test.mjs

      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          bash deploy/test-activate.sh

      - name: Prepare site with certificate settings
        env:
          CERTIFICATE_CODE: ${{ secrets.CERTIFICATE_CODE }}
          CERTIFICATE_PIN: ${{ secrets.CERTIFICATE_PIN }}
        run: |
          publish_directory=$(node deploy/build-site.mjs)
          node --check "$publish_directory/config.js"
          printf 'PUBLISH_DIRECTORY=%s\n' "$publish_directory" >> "$GITHUB_ENV"

      - name: Upload and activate release
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/upload-release.sh

      - name: Verify public HTTPS
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Initial DNS propagation and certificate issuance can briefly fail resolution/TLS.
          curl_options=(--fail --silent --show-error --retry-all-errors --retry 30 --retry-delay 10 --retry-max-time 300 --max-time 20)
          actual=$(curl "${curl_options[@]}" https://artkompaneets.ru/release.txt)
          test "$actual" = "$RELEASE_ID"
          curl "${curl_options[@]}" https://artkompaneets.ru/ -o /dev/null
